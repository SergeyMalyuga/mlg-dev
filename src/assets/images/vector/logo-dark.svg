<!--
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="50" viewBox="0 0 500 500">
  <defs>
    &lt;!&ndash; Градиент как в Angular логотипе &ndash;&gt;

    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000033" stop-opacity="1"/>    &lt;!&ndash; глубокий тёмно‑синий (зенит) &ndash;&gt;
      <stop offset="40%" stop-color="#191970" stop-opacity="0.9"/>  &lt;!&ndash; тёмно‑синий &ndash;&gt;
      <stop offset="70%" stop-color="#2c3e50" stop-opacity="0.8"/>  &lt;!&ndash; сине‑серый &ndash;&gt;
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="1"/>
    </linearGradient>

    <style>
      @font-face {
        font-family: 'David Libre';
        src: url('https://fonts.gstatic.com/s/davidlibre/v12/u-4l5qyxN2Z9-r4Z78A.woff2') format('woff2'),
        url('https://fonts.gstatic.com/s/davidlibre/v12/u-4l5qyxN2Z9-r4Z78A.ttf') format('ttf');
        font-weight: 400;
        font-style: normal;
      }
    </style>
  </defs>

  &lt;!&ndash; Текст с градиентом &ndash;&gt;
  <text
    style="fill: url(#flameGradient); font-family: 'David Libre', serif; font-size: 370px;"
    text-anchor="middle"
    dominant-baseline="middle"
    x="250"
    y="250"
  >MLG | dev</text>

  &lt;!&ndash; Или с радиальным градиентом: fill="url(#radialGradient)" &ndash;&gt;
</svg>
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <!-- Огненный градиент -->
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>   <!-- золотой -->
      <stop offset="30%" stop-color="#FFA500"/>  <!-- оранжевый -->
      <stop offset="70%" stop-color="#FF4500"/>  <!-- красно-оранжевый -->
      <stop offset="100%" stop-color="#DC143C"/> <!-- малиновый -->
    </linearGradient>

    <!-- Дополнительный градиент для dev (чтобы не уходил в розовый) -->
    <linearGradient id="devGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C42"/>  <!-- тыквенный -->
      <stop offset="100%" stop-color="#E65C1E"/> <!-- терракотовый -->
    </linearGradient>
  </defs>

  <text x="10" y="35" font-family="Inter, Arial, sans-serif" font-size="35">
    <!-- MLG с огненным градиентом -->
    <tspan font-weight="800" fill="url(#fireGradient)">MLG</tspan>

    <!-- Разделитель янтарный -->
    <tspan fill="#FFA500" font-weight="300" dx="2">|</tspan>

    <!-- dev в оранжево-терракотовых тонах (ближе к огненной гамме) -->
<!--        <tspan fill="#E65C1E" font-weight="400" dx="2" text-transform="lowercase">dev</tspan>-->
    <!-- Альтернатива: можно использовать градиент -->
    <tspan font-weight="400" fill="url(#devGradient)" dx="2" text-transform="lowercase">dev</tspan>
  </text>
</svg>
