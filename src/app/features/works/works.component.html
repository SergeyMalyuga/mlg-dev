<section class="works">
  <div class="works__content container">
    <div class="works__wrapper-title">
      <h2 class="works__title-main">Работы</h2>
      <p class="works__subtitle-section">Вот несколько моих работ:</p>
    </div>
    <ul class="works__list-cards">
      @for (card of works(); track card.id; let i = $index) {
        <li class="works__item-card">
          <app-work-card [card]="card" [index]="i"/>
        </li>
      }
    </ul>
  </div>
</section>
